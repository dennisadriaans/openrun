name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `biome ci` never writes; it fails on anything `pnpm lint:fix` would have
      # changed, so the fix is always one command away for a contributor.
      - name: Biome
        run: pnpm exec biome ci src scripts

  verify:
    name: typecheck · test · build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          # Forward-compatibility canary. Runtime discovery and `node:test` are
          # the parts most likely to move under us.
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # node itself still runs as a Windows process — which is the point:
      # `server/userPath.ts` has real win32 branches.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # `pnpm build` regenerates src/routeTree.gen.ts through the TanStack Start
      # Vite plugin, so a stale committed copy shows up as a dirty tree right
      # here for free.
      #
      # Note for anyone tempted to use `pnpm generate-routes` instead: the
      # standalone router-cli currently emits a *different* Register block from
      # the Vite plugin (it drops the `config` entry that types the start
      # instance). The plugin's output is the authoritative one — that is what
      # dev and build both run.
      - name: Warn if routeTree.gen.ts is out of date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::warning file=src/routeTree.gen.ts::Stale. Run 'pnpm build' and commit the regenerated file."
            git diff -- src/routeTree.gen.ts
          fi

  licenses:
    name: dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Advisory: AGPLv3 can absorb permissive licences, but a copyleft
      # production dependency would constrain the commercial licence offer
      # (COMMERCIAL-LICENSE.md), so surface it early.
      - name: Production dependency licences
        run: pnpm licenses list --prod || true
