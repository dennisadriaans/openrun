name: Release · publish

# Creates the GitHub Release for a vX.Y.Z tag. The tag, not a branch, is the
# trigger: the maintainer tags the merged `chore(release): vX.Y.Z` commit, and
# the Release must describe exactly that commit. Re-running is safe — publish
# skips a Release that already exists.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The vX.Y.Z tag to (re)publish
        type: string
        required: true

permissions:
  # gh release create
  contents: write

concurrency:
  group: release-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify release commit
        run: |
          pnpm exec biome ci apps packages scripts
          pnpm architecture:check
          pnpm contract:check
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:publish -- --expect="$TAG"
