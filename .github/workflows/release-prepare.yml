name: Release · prepare

on:
  # Retry hourly on Monday so a delayed/dropped 09:00 run does not skip the
  # week. The cadence gate permits only the first successful release that day.
  schedule:
    - cron: '0 * * * 1'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      ignore_cadence:
        description: Prepare now, ignoring the configured cadence
        type: boolean
        default: false
      allow_major:
        description: Allow an automatic major release at or above 1.0
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure release author
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      # Repair a release PR that merged after an earlier prepare job timed out,
      # or a tag whose GitHub Release creation failed partway through.
      - name: Reconcile pending release
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:publish

      - name: Prepare
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.ignore_cadence }}" != "true" ]]; then
            args+=(--respect-cadence)
          fi
          if [[ "${{ inputs.allow_major }}" == "true" ]]; then
            args+=(--allow-major)
          fi
          pnpm release:prepare -- "${args[@]}"

      # `prepare` writes the release commit through the GitHub API so it is
      # signed and attributed, which means the branch is already on the remote
      # at the right commit. This push is the no-op that proves the local and
      # remote tips agree, and the fallback when prepare committed locally.
      - name: Push release branch
        if: steps.release.outputs.prepared == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git push --force-with-lease origin "$BRANCH"

      - name: Open or resume release PR
        if: steps.release.outputs.prepared != 'false'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
          REASON: ${{ steps.release.outputs.reason }}
        run: |
          # Resume an open PR, and report a merged one so the caller can publish
          # it. A *closed* PR is deliberately not reopened: it was superseded —
          # typically its branch was deleted and rebuilt to replace a bad commit
          # — and GitHub refuses to reopen a PR whose head has been recreated.
          # Leave it closed and open a fresh PR for the current branch below.
          url=$(gh pr list --head "$BRANCH" --state open --limit 1 --json url --jq '.[0].url // ""')
          if [[ -z "$url" ]]; then
            merged_url=$(gh pr list --head "$BRANCH" --state merged --limit 1 --json url --jq '.[0].url // ""')
            if [[ -n "$merged_url" ]]; then
              echo "url=$merged_url" >> "$GITHUB_OUTPUT"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -n "$url" ]]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo '## Summary'
            echo ''
            echo "- Prepare **$TAG** for release."
            echo "- $REASON"
            echo ''
            echo '## Test plan'
            echo ''
            echo '- [ ] Confirm the version and generated changelog match the changes since the previous tag.'
            echo '- [ ] Merge this PR and confirm the matching tag and GitHub Release are created.'
          } > /tmp/pr-body.md
          url=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): $TAG" \
            --body-file /tmp/pr-body.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "merged=false" >> "$GITHUB_OUTPUT"

      # A PR opened by GITHUB_TOKEN does not trigger pull_request workflows.
      # Run the same CI workflow explicitly on the release branch instead.
      - name: Run CI for release branch
        if: steps.release.outputs.prepared != 'false' && steps.pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"

      - name: Enable auto-merge
        if: steps.release.outputs.prepared != 'false' && steps.pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: gh pr merge "$PR_URL" --auto --squash

      # A merge performed with GITHUB_TOKEN does not emit another workflow run,
      # so the push trigger in release-publish.yml cannot observe this merge.
      # A PR still waiting on auto-merge is a normal state, not a failure: the
      # next scheduled run reconciles it via `release:publish`. So a timeout
      # here leaves the job green and simply skips publishing this time round —
      # only a PR that was *closed unmerged* is a real error worth failing on.
      - name: Wait for release PR to merge
        if: steps.release.outputs.prepared != 'false'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          WAIT_MINUTES: '20'
        run: |
          deadline=$(( SECONDS + WAIT_MINUTES * 60 ))
          while (( SECONDS < deadline )); do
            read -r merged_at state < <(
              gh pr view "$PR_URL" --json mergedAt,state --jq '"\(.mergedAt // "-") \(.state)"'
            )
            if [[ "$merged_at" != "-" ]]; then
              sha=$(gh pr view "$PR_URL" --json mergeCommit --jq '.mergeCommit.oid')
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$state" == "CLOSED" ]]; then
              echo "::error::Release PR $PR_URL was closed without merging."
              exit 1
            fi
            sleep 10
          done

          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$PR_URL has not merged yet; the next scheduled run will publish it."
          {
            echo "### Release PR still open"
            echo ""
            echo "$PR_URL did not merge within ${WAIT_MINUTES} minutes."
            echo "It stays queued — the next scheduled run publishes it once it lands."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish and verify merged release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin "$MERGE_SHA"
          git checkout --detach "$MERGE_SHA"
          pnpm release:publish -- --expect="$TAG"

      - name: Remove release branch
        if: steps.merge.outputs.merged == 'true'
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
        run: git push origin --delete "$BRANCH" || true
