name: Release · CLI

# Publishes @dennisadriaans/openrun from a cli-vX.Y.Z tag. The tag, not a
# branch, is the trigger: npm versions are immutable, so the bytes behind one
# must come from a ref nobody moves. Re-running is safe — the publish step
# skips npm and the GitHub Release when either already exists.

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The cli-vX.Y.Z tag to (re)publish
        type: string
        required: true

permissions:
  # gh release create
  contents: write
  # npm trusted publishing and --provenance both need an OIDC token.
  id-token: write

concurrency:
  group: release-cli-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The trusted publisher on npmjs.com names this environment; add required
    # reviewers to it to put a human in front of every publish.
    environment: npm
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^cli-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a cli-vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1+; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Verify release commit
        run: |
          pnpm exec biome ci apps packages scripts
          pnpm architecture:check
          pnpm contract:check
          pnpm typecheck
          pnpm test

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty unless the NPM_TOKEN fallback is configured; with a trusted
          # publisher on npmjs.com, npm authenticates over OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release:cli:publish -- --expect="$TAG"
