version: 2

updates:
  # Automated version and security-update PRs are disabled.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: '*'
    groups:
      codemirror:
        patterns:
          - '@codemirror/*'
          - '@lezer/*'
          - '@uiw/react-codemirror'
      tanstack:
        patterns:
          - '@tanstack/*'
      types:
        patterns:
          - '@types/*'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    rebase-strategy: disabled
    ignore:
      - dependency-name: '*'
